quarkus.devservices.enabled=false

quarkus.http.port=8000
# Allow large log uploads for Root Cause Analysis: up to 6 files x 50MB + JSON overhead
quarkus.http.limits.max-body-size=350M
# How often the tool samples in-flight API requests in the background so that "Processing
# Time" on the API Data page counts from when a request actually started (accurate to within
# one interval), even for requests already running before the page was opened. Lower = more
# accurate but more frequent thread dumps against JBoss.
monitor.active-requests.poll-interval=5s

quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*

# Logging — level from LOG_LEVEL env var (set in set-env.txt), default INFO
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."com.rh.monitor".level=${LOG_LEVEL:INFO}

# Console logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# File logging — daily rotation in logs/ directory
quarkus.log.file.enable=true
quarkus.log.file.path=logs/jboss-monitor.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.max-file-size=50M
quarkus.log.file.rotation.max-backup-index=30
quarkus.log.file.rotation.rotate-on-boot=false
